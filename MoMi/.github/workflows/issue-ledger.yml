name: Enforce Linear issue mapping

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Verify matching Linear issue
        env:
          MOMI_PR_BODY: ${{ github.event.pull_request.body }}
          MOXX_HEAD_REF: ${{ github.head_ref }}
        run: node scripts/check_pull_request_issue_tracking.ts
