name: Triage new issues

on:
  issues:
    types: [opened]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open issue number to re-triage; blank catches up oldest pending
        required: false
        type: string

permissions: {}

jobs:
  enqueue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/codex/issue-triage.config.json
            scripts/issue_triage
            scripts/dev_loop/types.ts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
      - name: Enqueue issue idempotently
        env:
          GH_TOKEN: ${{ github.token }}
          TRIAGE_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/issue_triage/run_enqueue_issue.ts

  model:
    needs: enqueue
    if: always() && (needs.enqueue.result == 'success' || needs.enqueue.result == 'skipped')
    concurrency:
      group: issue-triage-model
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      issue_number: ${{ steps.context.outputs.issue_number }}
      result: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/codex
            scripts/issue_triage
            scripts/dev_loop/types.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
      - name: Build bounded untrusted issue context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          TRIAGE_ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: node scripts/issue_triage/run_prepare_context.ts
      - name: Run schema-constrained read-only triage
        if: steps.context.outputs.should_triage == 'true'
        id: codex
        uses: openai/codex-action@e469131063221562acfb9ea6bbc9fd7f27226ffb # v1.8
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/issue-triage-prompt.md
          output-schema-file: .github/codex/issue-triage.schema.json
          codex-version: 0.145.0
          model: gpt-5.4-mini
          effort: low
          sandbox: read-only
          safety-strategy: drop-sudo
          allow-users: "*"

  writer:
    needs: model
    if: needs.model.result == 'success' && needs.model.outputs.result != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/codex/issue-triage.config.json
            scripts/issue_triage
            scripts/dev_loop/types.ts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
      - name: Validate references and apply idempotently
        env:
          GH_TOKEN: ${{ github.token }}
          TRIAGE_ISSUE_NUMBER: ${{ needs.model.outputs.issue_number }}
          TRIAGE_OUTPUT: ${{ needs.model.outputs.result }}
        run: node scripts/issue_triage/run_apply_triage.ts
