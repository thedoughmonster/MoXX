name: Promote development to production

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote-prod
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod-promotion
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - run: git fetch origin dev:refs/remotes/origin/dev prod:refs/remotes/origin/prod
      - name: Verify approved promotion PR
        id: promotion
        shell: bash
        run: |
          pr=$(gh pr list --base prod --head dev --state open --json number --jq 'if length == 1 then .[0].number else empty end')
          test -n "$pr" || { echo "Expected one open dev-to-prod PR"; exit 1; }
          decision=$(gh pr view "$pr" --json reviewDecision --jq .reviewDecision)
          test "$decision" = "APPROVED" || { echo "Promotion PR is not approved"; exit 1; }
          pr_sha=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)
          dev_sha=$(git rev-parse origin/dev)
          test "$pr_sha" = "$dev_sha" || { echo "Promotion PR is stale"; exit 1; }
          git merge-base --is-ancestor origin/prod origin/dev
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
      - name: Fast-forward production
        run: git push origin origin/dev:refs/heads/prod
      - name: Close promotion PR
        run: gh pr close "${{ steps.promotion.outputs.pr }}" --comment "Promoted by exact-SHA fast-forward."
