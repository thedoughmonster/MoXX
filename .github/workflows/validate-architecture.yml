name: Validate architecture

on:
  pull_request:
    branches: [dev, prod]
    paths:
      - architecture/**
      - .github/workflows/validate-architecture.yml
  push:
    branches: [dev]
    paths:
      - architecture/**
      - .github/workflows/validate-architecture.yml

concurrency:
  group: validate-architecture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  architecture:
    name: architecture-model
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: architecture
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: architecture/.node-version
          cache: pnpm
          cache-dependency-path: architecture/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
