# MOX-390 registration touch: mutation remains workflow_dispatch-only.
name: Deploy backend production
run-name: deploy-prod ${{ inputs.expected_sha }} ${{ inputs.plan_sha256 }}

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact prod commit already promoted from development
        required: true
        type: string
      base_sha:
        description: Exact development release diff base
        required: true
        type: string
      services:
        description: Comma-separated services from the exact dev receipt
        required: true
        type: string
      plan_sha256:
        description: Exact dev release plan digest
        required: true
        type: string
      validated_tree:
        description: Exact tree previously validated in development
        required: true
        type: string
      retention_approval:
        description: Protected approval JSON for the bounded retention exception
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    defaults:
      run:
        shell: bash
        working-directory: MoMi
    env:
      MOMI_PROD_REF: origin/prod
      MOMI_EXPECTED_SHA: ${{ inputs.expected_sha }}
      MOMI_PLAN_SHA256: ${{ inputs.plan_sha256 }}
      MOMI_VALIDATED_TREE: ${{ inputs.validated_tree }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.retention_approval != '' && 'dev' || 'prod' }}
          fetch-depth: 0
      - name: Verify exact production commit
        run: |
          test "$MOMI_EXPECTED_SHA" = "$GITHUB_SHA"
          test "$MOMI_EXPECTED_SHA" = "$(git rev-parse HEAD)"
      - run: git fetch origin dev:refs/remotes/origin/dev prod:refs/remotes/origin/prod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: MoMi/.node-version
          cache: pnpm
          cache-dependency-path: MoMi/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Recompute and verify development release plan
        if: ${{ inputs.retention_approval == '' }}
        run: |
          pnpm momi-impact plan --base "${{ inputs.base_sha }}" \
            --head "$MOMI_EXPECTED_SHA" --output .momi/release-plan.json
          node scripts/assert_bound_deployment_plan.ts \
            --plan .momi/release-plan.json \
            --digest "$MOMI_PLAN_SHA256" \
            --head "$MOMI_EXPECTED_SHA" \
            --tree "$MOMI_VALIDATED_TREE" \
            --services "${{ inputs.services }}"
      - run: pnpm run deploy:apply -- --env prod --services "${{ inputs.services }}"
        if: ${{ inputs.retention_approval == '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Verify retention exception approval
        if: ${{ inputs.retention_approval != '' }}
        env:
          MOMI_SERVICES: ${{ inputs.services }}
          MOMI_RETENTION_APPROVAL_JSON: ${{ inputs.retention_approval }}
          MOMI_RETENTION_APPROVAL_SHA256: ${{ vars.MOMI_RETENTION_APPROVAL_SHA256 }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/run_retention_release.ts --env prod --verify-only
      - name: Run approved retention exception
        if: ${{ inputs.retention_approval != '' }}
        env:
          MOMI_SERVICES: ${{ inputs.services }}
          MOMI_RETENTION_APPROVAL_JSON: ${{ inputs.retention_approval }}
          MOMI_RETENTION_APPROVAL_SHA256: ${{ vars.MOMI_RETENTION_APPROVAL_SHA256 }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/run_retention_release.ts --env prod
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.retention_approval == '' }}
        with:
          name: prod-release-${{ github.sha }}
          path: MoMi/.momi/releases/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ success() && inputs.retention_approval != '' }}
        with:
          name: retention-prod-${{ github.sha }}-${{ github.run_id }}
          path: MoMi/.momi/retention-release-receipt.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && inputs.retention_approval != '' && !success() }}
        with:
          name: retention-prod-evidence-${{ github.sha }}-${{ github.run_id }}
          path: MoMi/.momi/retention-release-evidence.json
          if-no-files-found: ignore
