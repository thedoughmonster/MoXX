# MOX-390 registration touch: mutation remains workflow_dispatch-only.
name: Deploy backend production
run-name: deploy-prod ${{ inputs.expected_sha }} ${{ inputs.plan_sha256 }}

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact prod commit already promoted from development
        required: true
        type: string
      base_sha:
        description: Exact development release diff base
        required: true
        type: string
      services:
        description: Comma-separated services from the exact dev receipt
        required: true
        type: string
      plan_sha256:
        description: Exact dev release plan digest
        required: true
        type: string
      validated_tree:
        description: Exact tree previously validated in development
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    defaults:
      run:
        shell: bash
        working-directory: MoMi
    env:
      MOMI_PROD_REF: origin/prod
      MOMI_EXPECTED_SHA: ${{ inputs.expected_sha }}
      MOMI_PLAN_SHA256: ${{ inputs.plan_sha256 }}
      MOMI_VALIDATED_TREE: ${{ inputs.validated_tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: prod
          fetch-depth: 0
      - name: Verify exact production commit
        run: |
          test "$MOMI_EXPECTED_SHA" = "$GITHUB_SHA"
          test "$MOMI_EXPECTED_SHA" = "$(git rev-parse HEAD)"
      - run: git fetch origin dev:refs/remotes/origin/dev prod:refs/remotes/origin/prod
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: MoMi/.node-version
          cache: pnpm
          cache-dependency-path: MoMi/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Recompute and verify development release plan
        run: |
          pnpm momi-impact plan --base "${{ inputs.base_sha }}" \
            --head "$MOMI_EXPECTED_SHA" --output .momi/release-plan.json
          node scripts/assert_bound_deployment_plan.ts \
            --plan .momi/release-plan.json \
            --digest "$MOMI_PLAN_SHA256" \
            --head "$MOMI_EXPECTED_SHA" \
            --tree "$MOMI_VALIDATED_TREE" \
            --services "${{ inputs.services }}"
      - run: pnpm run deploy:apply -- --env prod --services "${{ inputs.services }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prod-release-${{ github.sha }}
          path: MoMi/.momi/releases/*.json
          if-no-files-found: error
