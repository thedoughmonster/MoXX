name: cloudflare-preview-rollback-proof

on:
  push:
    branches:
      - agent/223-cloudflare-credential-preflight
    paths:
      - .github/workflows/cloudflare-preview-rollback-proof.yml

permissions:
  contents: read

concurrency:
  group: moxi-web-preorder-preview
  cancel-in-progress: false

jobs:
  prove:
    name: rollback-and-restore-preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PREVIEW_URL: https://moxi-web-preorder-preview.thedoughmonster.workers.dev
      ROLLBACK_VERSION_ID: af4d88a6-ce57-400f-a24b-9bff2bb5796a
      ROLLBACK_RELEASE_ID: 7042841e908abe0c8c55e28e243f79e3ffb4d54d
      VITE_APP_STAGE: preview
      VITE_PREORDER_API_ORIGIN: https://preorder-api.invalid
      VITE_PREORDER_API_VERSION: v1
      VITE_RELEASE_ID: ${{ github.sha }}
    steps:
      - name: Checkout exact restore release
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate restore release before rollback
        run: pnpm check

      - name: Roll back preview to version 1
        run: >-
          pnpm exec wrangler rollback "$ROLLBACK_VERSION_ID"
          --env preview
          --yes
          --message "#223 preview rollback proof ${{ github.run_id }}"

      - name: Verify rollback release is live
        shell: bash
        run: |
          for attempt in {1..10}; do
            payload="$(curl --fail --silent --show-error "$PREVIEW_URL/health")"
            release="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).release)' "$payload")"
            if [[ "$release" == "$ROLLBACK_RELEASE_ID" ]]; then
              echo "rollback release verified: $release"
              exit 0
            fi
            sleep 2
          done
          echo "rollback release did not become active" >&2
          exit 1

      - name: Restore current fixed preview release
        run: >-
          pnpm exec wrangler deploy
          --env preview
          --minify
          --strict
          --message "preview restore ${{ github.sha }} after rollback proof"

      - name: Verify restored release is live
        shell: bash
        run: |
          for attempt in {1..10}; do
            payload="$(curl --fail --silent --show-error "$PREVIEW_URL/health")"
            release="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).release)' "$payload")"
            if [[ "$release" == "$VITE_RELEASE_ID" ]]; then
              echo "restored release verified: $release"
              exit 0
            fi
            sleep 2
          done
          echo "restored release did not become active" >&2
          exit 1

      - name: Report final preview versions
        run: pnpm exec wrangler versions list --env preview --json
