name: Verify debt lifecycle remediation issues

on:
  pull_request_target:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify focused remediation issues from trusted workflow code
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const registryPath = "MoMi/docs/debt-lifecycle-registry.json"
            const relevantPaths = new Set([
              registryPath,
              "MoMi/docs/service-access-debt-baseline.json",
              "MoMi/docs/service-constitution-debt-baseline.json",
              "MoMi/schemas/debt-lifecycle-registry-v1.schema.json",
              ".github/workflows/debt-lifecycle-issues.yml",
            ])
            let ref = context.sha
            if (context.eventName === "pull_request_target") {
              const files = await github.paginate(
                github.rest.pulls.listFiles,
                { ...context.repo, pull_number: context.issue.number, per_page: 100 },
              )
              if (!files.some((file) => relevantPaths.has(file.filename))) {
                core.notice("Debt lifecycle verification: N/A (unrelated change)")
                return
              }
              ref = context.payload.pull_request.head.sha
            }
            let registry
            try {
              const response = await github.rest.repos.getContent({
                ...context.repo,
                path: registryPath,
                ref,
              })
              if (Array.isArray(response.data) || response.data.type !== "file") {
                core.setFailed("Debt lifecycle verification indeterminate: registry is not a file")
                return
              }
              registry = JSON.parse(
                Buffer.from(response.data.content, "base64").toString("utf8"),
              )
            } catch (error) {
              core.setFailed(
                `Debt lifecycle verification indeterminate: ${error.message}`,
              )
              return
            }
            const today = new Date().toISOString().slice(0, 10)
            for (const record of registry.records) {
              if (today > record.expires_on) {
                core.setFailed(`#${record.remediation_issue} lifecycle metadata is expired`)
                return
              }
              if (today > record.next_review_on) {
                core.setFailed(`#${record.remediation_issue} lifecycle review is overdue`)
                return
              }
            }
            const issues = [...new Set(
              registry.records.map((record) => record.remediation_issue),
            )].sort((left, right) => left - right)
            for (const issue_number of issues) {
              let issue
              try {
                issue = await github.rest.issues.get({ ...context.repo, issue_number })
              } catch (error) {
                core.setFailed(
                  `Debt lifecycle verification indeterminate for #${issue_number}: ` +
                    error.message,
                )
                return
              }
              if (issue.data.pull_request || issue.data.state !== "open") {
                core.setFailed(`#${issue_number} must be an open remediation issue`)
                return
              }
            }
            core.notice(`Verified ${issues.length} open remediation issues`)
