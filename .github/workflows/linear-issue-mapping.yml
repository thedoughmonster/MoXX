name: Enforce Linear issue mapping

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: linear-issue-mapping-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
        working-directory: MoMi
    steps:
      - name: Classify native Dependabot update
        id: mapping
        working-directory: .
        env:
          MOXX_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          MOXX_HEAD_REF: ${{ github.head_ref }}
          MOXX_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          MOXX_REPOSITORY: ${{ github.repository }}
        run: |
          mapping_required=true
          if test "$MOXX_PR_AUTHOR" = "dependabot[bot]" \
            && [[ "$MOXX_HEAD_REF" == dependabot/* ]] \
            && test "$MOXX_HEAD_REPOSITORY" = "$MOXX_REPOSITORY"; then
            mapping_required=false
            echo "Native same-repository Dependabot update is exempt from human Linear mapping."
          fi
          echo "required=$mapping_required" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.mapping.outputs.required == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.mapping.outputs.required == 'true'
        with:
          node-version-file: MoMi/.node-version
      - name: Verify matching Linear issue
        if: steps.mapping.outputs.required == 'true'
        env:
          MOMI_PR_BODY: ${{ github.event.pull_request.body }}
          MOXX_HEAD_REF: ${{ github.head_ref }}
        run: node scripts/check_pull_request_issue_tracking.ts
