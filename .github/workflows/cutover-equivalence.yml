name: Prove cutover deployment equivalence

on:
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/**"
      - "MoMi/**"
      - "MoXi/**"
      - "docs/mox-390-cutover-receipt.md"
      - "scripts/validate-cutover-receipt.mjs"
      - "tests/cutover-receipt.test.mjs"
  workflow_dispatch:

concurrency:
  group: cutover-equivalence-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: cutover-path-classifier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      ui: ${{ steps.paths.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Select bounded deployment dry-runs
        id: paths
        shell: bash
        env:
          MOXX_EVENT_NAME: ${{ github.event_name }}
          MOXX_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MOXX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          backend=false
          ui=false

          if test "$MOXX_EVENT_NAME" != "pull_request"; then
            backend=true
            ui=true
          else
            while IFS= read -r path; do
              case "$path" in
                MoMi/*|.github/workflows/deploy-dev.yml|.github/workflows/deploy-prod.yml|.github/workflows/promote-prod.yml|.github/workflows/renew-database-access.yml|.github/workflows/supabase-credential-preflight.yml|.github/workflows/validate.yml)
                  backend=true
                  ;;
                MoXi/*|.github/workflows/cloudflare-credential-preflight.yml|.github/workflows/cloudflare-preview.yml|.github/workflows/cloudflare-production.yml|.github/workflows/validate-ui.yml)
                  ui=true
                  ;;
                .github/workflows/cutover-equivalence.yml)
                  backend=true
                  ui=true
                  ;;
              esac
            done < <(git diff --name-only "$MOXX_BASE_SHA" "$MOXX_HEAD_SHA")
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"

  receipt:
    name: cutover-receipt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/validate-cutover-receipt.mjs
      - run: node --test tests/cutover-receipt.test.mjs

  backend-plan:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: backend-deployment-plan-dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: MoMi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: git fetch origin dev:refs/remotes/origin/dev prod:refs/remotes/origin/prod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: MoMi/.node-version
          cache: pnpm
          cache-dependency-path: MoMi/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build a non-mutating release plan
        run: >-
          pnpm momi-impact plan --base origin/dev --head HEAD
          --output .momi/cutover-plan.json

  ui-dry-run:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    name: cloudflare-worker-dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: MoXi
    env:
      VITE_APP_STAGE: preview
      VITE_PREORDER_API_ORIGIN: https://preorder-api.invalid
      VITE_PREORDER_API_VERSION: v1
      VITE_PREORDER_DATA_MODE: fixture
      VITE_RELEASE_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: MoXi/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run cloudflare:dry-run
