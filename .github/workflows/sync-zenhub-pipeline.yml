name: Sync Zenhub pipeline

on:
  issues:
    types: [opened, labeled, unlabeled, closed, reopened]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number; blank reconciles open and closed issues
        required: false
        type: string

permissions: {}

concurrency:
  group: zenhub-pipeline-${{ github.event.issue.number || inputs.issue_number || 'all' }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/run_zenhub_pipeline_sync.ts
            scripts/zenhub_pipeline_sync
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
      - name: Reconcile label-owned pipeline state
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.event.repository.id }}
          ZENHUB_API_TOKEN: ${{ secrets.ZENHUB_API_TOKEN }}
          ZENHUB_DEFAULT_STATUS_LABEL: ${{ vars.ZENHUB_DEFAULT_STATUS_LABEL }}
          ZENHUB_ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          ZENHUB_PIPELINE_MAP: ${{ vars.ZENHUB_PIPELINE_MAP }}
          ZENHUB_WORKSPACE_ID: ${{ vars.ZENHUB_WORKSPACE_ID }}
        run: node scripts/run_zenhub_pipeline_sync.ts
