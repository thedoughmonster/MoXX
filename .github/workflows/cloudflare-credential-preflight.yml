name: cloudflare-credential-preflight

on:
  push:
    branches:
      - agent/223-cloudflare-credential-preflight
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify-read-authority
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify bounded Cloudflare inventory access
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const hostname = 'preorder.dough.monster';
          const zoneName = 'dough.monster';

          if (!/^[a-f0-9]{32}$/.test(accountId ?? '')) {
            throw new Error('CLOUDFLARE_ACCOUNT_ID is missing or malformed');
          }
          if (!token) {
            throw new Error('CLOUDFLARE_API_TOKEN is missing');
          }

          async function api(path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              headers: { Authorization: `Bearer ${token}` }
            });
            const body = await response.json();
            if (!response.ok || body.success !== true) {
              const errors = Array.isArray(body.errors)
                ? body.errors.map(({ code, message }) => ({ code, message }))
                : [];
              throw new Error(`Cloudflare API rejected ${path}: ${JSON.stringify(errors)}`);
            }
            return body.result;
          }

          const scripts = await api(`/accounts/${accountId}/workers/scripts`);
          const domains = await api(`/accounts/${accountId}/workers/domains`);
          const zones = await api(`/zones?name=${encodeURIComponent(zoneName)}&account.id=${accountId}`);
          if (!Array.isArray(zones) || zones.length !== 1) {
            throw new Error(`Expected exactly one ${zoneName} zone; found ${Array.isArray(zones) ? zones.length : 0}`);
          }

          const zone = zones[0];
          const dnsRecords = await api(`/zones/${zone.id}/dns_records?name=${encodeURIComponent(hostname)}`);
          const routes = await api(`/zones/${zone.id}/workers/routes`);
          const matchingDomains = Array.isArray(domains)
            ? domains.filter((domain) => domain.hostname === hostname)
            : [];

          console.log(JSON.stringify({
            account_id_matches: true,
            worker_script_count: Array.isArray(scripts) ? scripts.length : 0,
            zone: { id: zone.id, name: zone.name, status: zone.status },
            preorder_dns_record_count: Array.isArray(dnsRecords) ? dnsRecords.length : 0,
            preorder_custom_domain_count: matchingDomains.length,
            worker_route_count: Array.isArray(routes) ? routes.length : 0
          }, null, 2));
          NODE
