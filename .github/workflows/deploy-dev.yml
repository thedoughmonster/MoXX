name: Deploy development

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact dev commit whose migrations are already applied
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    env:
      MOMI_PROD_REF: origin/prod
      MOMI_EXPECTED_SHA: ${{ inputs.expected_sha }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - name: Verify exact development commit
        shell: bash
        run: |
          test "$MOMI_EXPECTED_SHA" = "$GITHUB_SHA"
          test "$MOMI_EXPECTED_SHA" = "$(git rev-parse HEAD)"
      - run: git fetch origin prod:refs/remotes/origin/prod
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deploy:apply -- --env dev --service all
      - uses: actions/upload-artifact@v4
        with:
          name: dev-release-${{ github.sha }}
          path: .momi/releases/*.json
          if-no-files-found: error
