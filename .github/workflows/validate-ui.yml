name: Validate UI

on:
  push:
    branches: [dev, prod]
    paths:
      - "MoXi/**"
      - ".github/workflows/validate-ui.yml"
  pull_request:
    branches: [dev, prod]
    paths:
      - "MoXi/**"
      - ".github/workflows/validate-ui.yml"

concurrency:
  group: validate-ui-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: validate-ui-final
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: MoXi
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.0.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: MoXi/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for interaction tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Deterministic check
        env:
          VITE_APP_STAGE: preview
          VITE_PREORDER_API_ORIGIN: https://preorder-api.invalid
          VITE_PREORDER_API_VERSION: v1
          VITE_PREORDER_DATA_MODE: fixture
          VITE_RELEASE_ID: ${{ github.sha }}
        run: pnpm run check
      - name: Verify exact worker custom domain
        run: |
          if ! grep -F '"pattern": "preorder.dough.monster"' wrangler.jsonc; then
            echo "wrangler.jsonc must include the exact production hostname preorder.dough.monster" >&2
            exit 1
          fi
      - name: Verify static smoke and health assets
        run: |
          if [ ! -f dist/health.json ] || [ ! -f dist/smoke.json ]; then
            echo "health.json and smoke.json must be emitted in build output" >&2
            exit 1
          fi
          node -e 'const fs=require("node:fs"); for (const f of ["dist/smoke.json","dist/health.json"]) JSON.parse(fs.readFileSync(f,"utf8"));'
