name: Validate monorepo routing

on:
  pull_request:
    branches: [dev, prod]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [dev]

concurrency:
  group: monorepo-routing-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  routing:
    name: monorepo-routing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Select product validation and enforce interface evidence
        env:
          MOXX_PR_BODY: >-
            ${{ github.event.pull_request.body || github.event.head_commit.message }}
          MOXX_BASE_SHA: >-
            ${{ github.event.pull_request.base.sha || github.event.before }}
          MOXX_HEAD_SHA: >-
            ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/monorepo-routing.mjs
          --base "$MOXX_BASE_SHA"
          --head "$MOXX_HEAD_SHA"

  static-config:
    name: monorepo-static-config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/validate-monorepo-automation.mjs
      - run: node --test tests/*.test.mjs
