name: Renew Supabase database access

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renew-supabase-database-access
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod
    defaults:
      run:
        shell: bash
        working-directory: MoMi
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: MoMi/.node-version
          cache: pnpm
          cache-dependency-path: MoMi/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run database-access:renew
