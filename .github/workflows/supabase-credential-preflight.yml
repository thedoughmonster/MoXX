name: Verify Supabase credential scope
run-name: supabase-credential-preflight ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment whose Supabase token will be verified
        required: true
        type: choice
        options: [dev, prod]

permissions:
  contents: read

jobs:
  verify:
    name: verify-read-authority-${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment }}
    steps:
      - name: Verify exact workflow authority before secret use
        env:
          MOXX_TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: node scripts/assert-supabase-preflight-authority.mjs
      - name: Verify bounded Supabase project read access
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MOXX_TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const targetEnvironment = process.env.MOXX_TARGET_ENVIRONMENT;
          const targetProjectRefs = {
            dev: 'xtbraqnlskmqxinjxxdn',
            prod: 'viodfldzuoypnpqaagag',
          };
          const targetProjectRef = targetProjectRefs[targetEnvironment];
          if (!targetProjectRef) throw new Error('Unsupported target environment');
          if (!/^sbp_[A-Za-z0-9_-]+$/.test(token ?? '')) {
            throw new Error('SUPABASE_ACCESS_TOKEN is missing or malformed');
          }
          const readTarget = async (path) => {
            const response = await fetch(`https://api.supabase.com${path}`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            let payload;
            try {
              payload = await response.json();
            } catch {
              throw new Error(`Supabase API returned non-JSON with HTTP ${response.status}`);
            }
            return { response, payload };
          };
          let targetKind = 'project';
          let result = await readTarget(`/v1/projects/${targetProjectRef}`);
          if (result.response.status === 404) {
            targetKind = 'branch';
            result = await readTarget(`/v1/branches/${targetProjectRef}`);
          }
          if (!result.response.ok || !result.payload || typeof result.payload !== 'object' || Array.isArray(result.payload)) {
            throw new Error(`Supabase API rejected target metadata read with HTTP ${result.response.status}`);
          }
          const returnedRef = result.payload.ref ?? result.payload.project_ref;
          if (returnedRef !== targetProjectRef) throw new Error('Supabase API returned a mismatched target reference');
          let permanentDatabaseMapping = 'not_applicable';
          if (targetEnvironment === 'prod') {
            const feature = await readTarget(
              `/v1/projects/${targetProjectRef}/jit-access`,
            );
            if (!feature.response.ok || feature.payload?.state !== 'enabled' ||
              feature.payload?.appliedSuccessfully !== true) {
              throw new Error('Production temporary database access is not enabled');
            }
            const mapping = await readTarget(
              `/v1/projects/${targetProjectRef}/database/jit`,
            );
            if (!mapping.response.ok || !mapping.payload ||
              typeof mapping.payload !== 'object' ||
              !Array.isArray(mapping.payload.user_roles)) {
              throw new Error(
                `Supabase API rejected database mapping read with HTTP ${mapping.response.status}`,
              );
            }
            const postgres = mapping.payload.user_roles.find(
              (role) => role?.role === 'postgres',
            );
            if (!postgres) throw new Error('Production mapping lacks postgres role');
            if (postgres.expires_at != null) {
              throw new Error('Production postgres mapping still expires');
            }
            permanentDatabaseMapping = 'verified';
          }
          console.log(JSON.stringify({
            authenticated: true,
            environment: targetEnvironment,
            permanent_database_mapping: permanentDatabaseMapping,
            target_resource: targetKind,
            target_metadata: 'readable',
            target_reference_matched: true,
          }, null, 2));
          NODE
