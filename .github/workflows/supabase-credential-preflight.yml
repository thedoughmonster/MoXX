name: Verify Supabase credential scope
run-name: supabase-credential-preflight ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment whose Supabase token will be verified
        required: true
        type: choice
        options: [dev, prod]

permissions:
  contents: read

jobs:
  verify:
    name: verify-read-authority-${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MOXX_TARGET_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Verify bounded Supabase project read access
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const targetEnvironment = process.env.MOXX_TARGET_ENVIRONMENT;
          const targetProjectRef = 'xtbraqnlskmqxinjxxdn';
          if (!/^sbp_[A-Za-z0-9_-]+$/.test(token ?? '')) {
            throw new Error('SUPABASE_ACCESS_TOKEN is missing or malformed');
          }
          const readTarget = async (path) => {
            const response = await fetch(`https://api.supabase.com${path}`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            let payload;
            try {
              payload = await response.json();
            } catch {
              throw new Error(`Supabase API returned non-JSON with HTTP ${response.status}`);
            }
            return { response, payload };
          };
          let targetKind = 'project';
          let result = await readTarget(`/v1/projects/${targetProjectRef}`);
          if (result.response.status === 404) {
            targetKind = 'branch';
            result = await readTarget(`/v1/branches/${targetProjectRef}`);
          }
          if (!result.response.ok || !result.payload || typeof result.payload !== 'object' || Array.isArray(result.payload)) {
            throw new Error(`Supabase API rejected target metadata read with HTTP ${result.response.status}`);
          }
          const returnedRef = result.payload.ref ?? result.payload.project_ref;
          if (returnedRef !== targetProjectRef) throw new Error('Supabase API returned a mismatched target reference');
          console.log(JSON.stringify({
            authenticated: true,
            environment: targetEnvironment,
            target_resource: targetKind,
            target_metadata: 'readable',
            target_reference_matched: true,
          }, null, 2));
          NODE
