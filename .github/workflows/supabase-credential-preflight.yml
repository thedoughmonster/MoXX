name: Verify Supabase credential scope
run-name: supabase-credential-preflight ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment whose Supabase token will be verified
        required: true
        type: choice
        options: [dev, prod]

permissions:
  contents: read

jobs:
  verify:
    name: verify-read-authority-${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MOXX_TARGET_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Verify bounded Supabase project inventory access
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const targetEnvironment = process.env.MOXX_TARGET_ENVIRONMENT;
          const targetProjectRef = 'xtbraqnlskmqxinjxxdn';
          if (!/^sbp_[A-Za-z0-9_-]+$/.test(token ?? '')) {
            throw new Error('SUPABASE_ACCESS_TOKEN is missing or malformed');
          }
          const response = await fetch('https://api.supabase.com/v1/projects', {
            headers: { Authorization: `Bearer ${token}` },
          });
          let projects;
          try {
            projects = await response.json();
          } catch {
            throw new Error(`Supabase API returned non-JSON with HTTP ${response.status}`);
          }
          if (!response.ok || !Array.isArray(projects)) {
            throw new Error(`Supabase API rejected project inventory with HTTP ${response.status}`);
          }
          const targetCount = projects.filter(({ id }) => id === targetProjectRef).length;
          if (targetCount !== 1) throw new Error('Expected exactly one target Supabase project');
          console.log(JSON.stringify({
            authenticated: true,
            environment: targetEnvironment,
            project_inventory: 'readable',
            target_project_present: true,
          }, null, 2));
          NODE
