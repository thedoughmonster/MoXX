name: Validate backend

on:
  pull_request:
    branches: [dev, prod]
    paths:
      - "MoMi/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact accepted base commit
        required: true
        type: string
      head_sha:
        description: Exact candidate commit
        required: true
        type: string
      development_baseline_sha:
        description: Exact trusted dev commit for migration immutability checks
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: validate-backend-${{ github.event.pull_request.number || inputs.head_sha }}
  cancel-in-progress: true

jobs:
  validate-final:
    name: validate-final
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: MoMi
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: momi_concurrency
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d momi_concurrency"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MOMI_BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
      MOMI_HEAD_REF: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
      MOMI_PROD_REF: origin/prod
      MOMI_DEV_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'prod' && github.event.pull_request.head.ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.event.pull_request.base.sha || inputs.development_baseline_sha }}
      ORDER_ALERT_DELIVERY_CONCURRENCY_DATABASE_URL: >-
        postgresql://postgres:postgres@127.0.0.1:5432/momi_concurrency
      WAREHOUSE_PROJECTION_SEARCH_PATH_DATABASE_URL: >-
        postgresql://postgres:postgres@127.0.0.1:5432/momi_concurrency
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.MOMI_HEAD_REF }}
          fetch-depth: 0
      - run: git fetch origin dev:refs/remotes/origin/dev prod:refs/remotes/origin/prod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: MoMi/.node-version
          cache: pnpm
          cache-dependency-path: MoMi/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Explain exact final validation plan
        run: >-
          pnpm momi-impact plan --base "$MOMI_BASE_REF" --head "$MOMI_HEAD_REF"
          --output .momi/impact-plan.json
      - name: Run the one final gate
        run: >-
          pnpm momi-check changed --final --base "$MOMI_BASE_REF"
          --head "$MOMI_HEAD_REF" --receipt .momi/validation-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: validation-${{ env.MOMI_HEAD_REF }}
          path: |
            MoMi/.momi/impact-plan.json
            MoMi/.momi/validation-receipt.json
            MoMi/.momi/check-receipt.json
            MoMi/.momi/logs/
          if-no-files-found: error
