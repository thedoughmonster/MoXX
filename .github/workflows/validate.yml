name: Validate backend

on:
  workflow_call:
    inputs:
      base_sha:
        description: Exact accepted base commit
        required: true
        type: string
      head_sha:
        description: Exact candidate commit
        required: true
        type: string
      development_baseline_sha:
        description: Exact trusted dev commit for migration immutability checks
        required: true
        type: string
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact accepted base commit
        required: true
        type: string
      head_sha:
        description: Exact candidate commit
        required: true
        type: string
      development_baseline_sha:
        description: Exact trusted dev commit for migration immutability checks
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: validate-backend-${{ github.event.pull_request.number || inputs.head_sha }}
  cancel-in-progress: true

jobs:
  validate-final:
    name: validate-final
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: MoMi
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: momi_concurrency
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d momi_concurrency"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MOMI_BASE_REF: ${{ inputs.base_sha }}
      MOMI_HEAD_REF: ${{ inputs.head_sha }}
      MOMI_PROD_REF: origin/prod
      MOMI_DEV_REF: ${{ github.event.pull_request.base.ref == 'prod' && github.event.pull_request.head.ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository && inputs.head_sha || inputs.development_baseline_sha }}
      ORDER_ALERT_DELIVERY_CONCURRENCY_DATABASE_URL: >-
        postgresql://postgres:postgres@127.0.0.1:5432/momi_concurrency
      WAREHOUSE_PROJECTION_SEARCH_PATH_DATABASE_URL: >-
        postgresql://postgres:postgres@127.0.0.1:5432/momi_concurrency
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MOMI_HEAD_REF }}
          fetch-depth: 0
      - run: git fetch origin dev:refs/remotes/origin/dev prod:refs/remotes/origin/prod
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: MoMi/.node-version
          cache: pnpm
          cache-dependency-path: MoMi/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Explain exact final validation plan
        run: >-
          pnpm momi-impact plan --base "$MOMI_BASE_REF" --head "$MOMI_HEAD_REF"
          --output .momi/impact-plan.json
      - name: Run the one final gate
        run: >-
          pnpm momi-check changed --final --base "$MOMI_BASE_REF"
          --head "$MOMI_HEAD_REF" --receipt .momi/validation-receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: validation-${{ env.MOMI_HEAD_REF }}
          path: |
            MoMi/.momi/impact-plan.json
            MoMi/.momi/validation-receipt.json
            MoMi/.momi/check-receipt.json
            MoMi/.momi/logs/
          if-no-files-found: error
