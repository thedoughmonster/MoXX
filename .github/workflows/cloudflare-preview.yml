# MOX-390 registration touch: mutation remains workflow_dispatch-only.
name: Deploy UI preview

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preview-only operation
        required: true
        type: choice
        default: deploy
        options: [deploy, rollback]
      version_id:
        description: Exact preview Worker version for rollback
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: moxi-web-preorder-preview
  cancel-in-progress: false

jobs:
  preview:
    name: ${{ inputs.operation || 'deploy' }}-preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: MoXi
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_APP_STAGE: preview
      VITE_PREORDER_API_ORIGIN: https://xtbraqnlskmqxinjxxdn.supabase.co
      VITE_PREORDER_API_VERSION: v1
      VITE_PREORDER_DATA_MODE: live
      VITE_SQUARE_SANDBOX_APPLICATION_ID: sandbox-sq0idb-5fqqJ2x3hNzSvwaLcIOq9A
      VITE_SQUARE_SANDBOX_LOCATION_ID: LN73GYJ0P4PY1
      VITE_RELEASE_ID: ${{ github.sha }}
    steps:
      - name: Checkout development release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.0.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: MoXi/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - if: inputs.operation == 'deploy'
        run: pnpm exec playwright install --with-deps chromium
      - if: inputs.operation == 'deploy'
        run: pnpm check
      - name: Deploy bounded preview Worker
        if: inputs.operation == 'deploy'
        run: >-
          pnpm exec wrangler deploy --env preview --minify --strict
          --message "preview ${{ github.sha }}"
      - name: Validate rollback target
        if: inputs.operation == 'rollback'
        env:
          VERSION_ID: ${{ inputs.version_id }}
        run: |
          if [[ ! "$VERSION_ID" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "version_id must be an exact Cloudflare version UUID" >&2
            exit 1
          fi
      - name: Roll back bounded preview Worker
        if: inputs.operation == 'rollback'
        env:
          VERSION_ID: ${{ inputs.version_id }}
        run: >-
          pnpm exec wrangler rollback "$VERSION_ID" --env preview --yes
          --message "preview rollback requested by GitHub Actions run ${{ github.run_id }}"
      - name: Report preview versions
        run: pnpm exec wrangler versions list --env preview --json
